<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paciência</title>
<meta name="description" content="Klondike, Spider, FreeCell, Pyramid e TriPeaks em um só app, com visual de vidro líquido. Funciona offline e pode ser instalado.">
<meta name="theme-color" content="#0b0f13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Paciência">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  img { max-width: 100%; }
  /* Layout: same family as the Tarefas/Hábitos/Diário app: near-black base, teal aurora, mint accent, cyan greeting,
     pill chips, dark cards with a colored left edge, floating glass dock plus a round button and a mint FAB.
     Performance rule: backdrop blur only on a few small chrome pieces; cards get glass from gradients and rim light. */
  :root {
    --base: #0b0f13;
    --mint: #52d6a3;
    --mint-ink: #05261a;
    --cyan: #62cbea;
    --coral: #f0766a;
    --amber: #f0b44c;
    --violet: #b690f6;
    --fg: #e9eef1;
    --dim: #8c99a5;
    --line: rgba(255, 255, 255, 0.12);
    --surface: rgba(22, 29, 37, 0.78);
    --ink: #11202b;
    --rose: #d93a4e;
    --font: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--base); height: 100%; }
  body {
    min-height: 100%;
    background: var(--base);
    color: var(--fg);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.4;
    padding-block: 14px 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
  .app { max-width: 520px; margin: 0 auto; position: relative; z-index: 1; padding-bottom: 120px; }

  /* static aurora, one composited layer that drifts slowly (no blur filters) */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .bg::before {
    content: ""; position: absolute; inset: -20%;
    background:
      radial-gradient(48% 34% at 12% 8%, rgba(38, 150, 118, 0.55), transparent 70%),
      radial-gradient(40% 30% at 92% 46%, rgba(60, 120, 150, 0.4), transparent 70%),
      radial-gradient(46% 30% at 30% 98%, rgba(140, 150, 40, 0.2), transparent 70%);
    animation: drift 40s ease-in-out infinite alternate;
    will-change: transform;
  }
  @keyframes drift { to { transform: translate3d(3%, 2%, 0) scale(1.05); } }

  /* liquid glass for small chrome only */
  .glass {
    position: relative;
    background: linear-gradient(140deg, rgba(255, 255, 255, 0.17), rgba(255, 255, 255, 0.04) 60%, rgba(255, 255, 255, 0.09));
    -webkit-backdrop-filter: blur(14px) saturate(1.5);
    backdrop-filter: blur(14px) saturate(1.5);
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.38), inset 0 -1px 0 rgba(255, 255, 255, 0.05), 0 8px 22px rgba(0, 0, 0, 0.35);
  }
  .glass::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(120% 80% at 14% -12%, rgba(255, 255, 255, 0.16), transparent 55%);
  }
  .glass > * { position: relative; z-index: 1; }
  svg.i { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Menu ---------- */
  .hero { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 10px; padding-block: 4px 18px; }
  .avatar { position: relative; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: var(--mint); }
  .avatar > svg.i { width: 30px; height: 30px; fill: currentColor; stroke: none; }
  .avatar .moon { position: absolute; right: -4px; bottom: -4px; width: 24px; height: 24px; border-radius: 50%; background: #1b2230; border: 1px solid var(--line); display: grid; place-items: center; color: var(--violet); z-index: 2; }
  .avatar .moon svg { width: 13px; height: 13px; }
  #greet { margin: 0; color: var(--cyan); font-size: clamp(21px, 6vw, 28px); line-height: 1.12; min-width: 0; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; }
  .ringbox { display: grid; justify-items: center; gap: 4px; }
  .ring { position: relative; width: 56px; height: 56px; display: grid; place-items: center; }
  .ring svg.r { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring .in { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line); color: var(--cyan); }
  .ring .in svg { width: 20px; height: 20px; }
  .ringbox span { font-size: 13px; color: var(--dim); font-weight: 600; font-variant-numeric: tabular-nums; }
  .datetile { width: 62px; height: 62px; border-radius: 20px; display: grid; place-content: center; text-align: center; line-height: 1.05; }
  .datetile span { font-size: 10px; letter-spacing: 0.05em; white-space: nowrap; font-weight: 700; color: var(--cyan); }
  .datetile b { font-size: 27px; font-weight: 800; }


  /* title block */
  .title { display: grid; justify-items: center; text-align: center; gap: 4px; padding-block: 10px 22px; }
  .title h1 { margin: 0; font-size: clamp(40px, 12.5vw, 56px); line-height: 1; font-weight: 800; letter-spacing: -0.02em; color: var(--cyan); text-shadow: 0 6px 30px rgba(98, 203, 234, 0.35); }
  .title p { margin: 0; color: var(--dim); font-size: 14px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; }
  .fan { position: relative; width: 150px; height: 112px; margin-bottom: 8px; }
  .fc {
    position: absolute; left: 50%; top: 6px; width: 66px; height: 94px; margin-left: -33px; border-radius: 10px;
    background: linear-gradient(155deg, rgba(255, 255, 255, 0.98), rgba(233, 243, 247, 0.96) 50%, rgba(207, 225, 233, 0.95));
    border: 1px solid rgba(255, 255, 255, 0.75); color: var(--ink); font-style: normal;
    box-shadow: inset 0 1px 0 #fff, inset 0 -10px 14px rgba(110, 170, 190, 0.2), 0 8px 18px rgba(0, 0, 0, 0.45);
    display: grid; align-content: start; justify-items: start; padding: 5px 8px; line-height: 1;
    transform-origin: 50% 120%; overflow: hidden;
  }
  .fc::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(118deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0) 40%); }
  .fc b { font-size: 22px; font-weight: 800; position: relative; }
  .fc span { font-size: 40px; position: absolute; right: 8px; bottom: 6px; }
  .fc.red { color: var(--rose); background: linear-gradient(155deg, rgba(255, 255, 255, 0.98), rgba(252, 238, 240, 0.96) 50%, rgba(243, 214, 220, 0.95)); }
  .fc.l { transform: rotate(-17deg) translateX(-30px); }
  .fc.r { transform: rotate(-1deg); }
  .fc.m { transform: rotate(15deg) translateX(30px); }

  .sec { display: flex; align-items: baseline; gap: 10px; padding: 0 4px 10px; }
  .sec b { font-size: 15px; letter-spacing: 0.08em; color: var(--mint); font-weight: 800; text-transform: uppercase; }
  .sec span { color: var(--dim); font-size: 14px; }
  .sec em { margin-left: auto; font-style: normal; color: var(--dim); font-weight: 700; font-variant-numeric: tabular-nums; }

  .stack { display: grid; gap: 12px; }
  .row-card {
    position: relative; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px;
    width: 100%; text-align: left; padding: 14px 14px 14px 16px;
    background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--mint));
    border-radius: 24px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 6px 16px rgba(0, 0, 0, 0.28);
    transition: transform 0.12s, border-color 0.15s;
  }
  button.row-card:active { transform: scale(0.985); }
  button.row-card:hover { border-color: rgba(255, 255, 255, 0.28); border-left-color: var(--c, var(--mint)); }
  .chk { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.4); display: grid; place-items: center; color: var(--mint-ink); }
  .chk.on { background: var(--mint); border-color: var(--mint); }
  .chk svg { width: 18px; height: 18px; stroke-width: 3; }
  .rc-main { display: grid; gap: 7px; min-width: 0; }
  .rc-title { display: flex; align-items: center; gap: 10px; }
  .rc-title b { font-size: 22px; font-weight: 700; line-height: 1.1; }
  .pips { display: inline-flex; gap: 4px; }
  .pips i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--c, var(--mint)); display: block; }
  .pips i.on { background: var(--c, var(--mint)); }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-style: normal; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px; color: var(--c, var(--mint)); background: color-mix(in srgb, var(--c, var(--mint)) 16%, transparent); }
  .rc-rec { font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .go { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--c, var(--mint)); background: color-mix(in srgb, var(--c, var(--mint)) 14%, transparent); }
  .go svg { width: 18px; height: 18px; }
  .resume { --c: var(--mint); border-color: rgba(82, 214, 163, 0.4); background: linear-gradient(135deg, rgba(82, 214, 163, 0.18), var(--surface) 70%); }
  .promise { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 20px; border: 1px dashed rgba(255, 255, 255, 0.22); color: var(--dim); font-size: 13.5px; }
  .promise svg { width: 18px; height: 18px; color: var(--mint); flex: none; }
  .stats { display: grid; gap: 6px; margin: 0; }
  .stats div { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
  .stats dt { color: var(--dim); }
  .stats dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
  .help-list { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--dim); font-size: 14px; }
  .help-list b { color: var(--fg); }

  /* docks */
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; pointer-events: none;
    padding-top: 6px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    padding-left: max(14px, env(safe-area-inset-left, 0px));
    padding-right: max(14px, env(safe-area-inset-right, 0px));
  }
  .dockrow { max-width: 520px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .dockbar { pointer-events: auto; flex: 1; min-width: 0; display: grid; gap: 4px; padding: 6px; border-radius: 99px; }
  .dockbar.c3 { grid-template-columns: repeat(3, 1fr); }
  .dockbar.c4 { grid-template-columns: repeat(4, 1fr); }
  .dk {
    display: grid; justify-items: center; gap: 3px; padding: 8px 2px 7px; min-width: 0;
    background: none; border: 1px solid transparent; border-radius: 99px; font-size: 12px; font-weight: 700;
    color: var(--dim); transition: background 0.15s, color 0.15s, opacity 0.15s, transform 0.12s; white-space: nowrap;
  }
  .dk svg { width: 24px; height: 24px; }
  .dk:active:not(:disabled) { transform: scale(0.95); background: rgba(255, 255, 255, 0.14); color: var(--fg); }
  .dk:disabled { opacity: 0.35; cursor: default; }
  .dk.on { color: var(--mint); background: rgba(82, 214, 163, 0.16); border-color: rgba(82, 214, 163, 0.4); }
  .dk.arm { color: var(--amber); background: rgba(240, 180, 76, 0.18); border-color: rgba(240, 180, 76, 0.4); }
  .dk .ic { position: relative; display: grid; }
  .bd { position: absolute; top: -5px; right: -10px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: var(--mint); color: var(--mint-ink); font-style: normal; font-size: 10.5px; font-weight: 800; line-height: 16px; text-align: center; }
  .bd:empty { display: none; }
  .round { pointer-events: auto; flex: none; width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; padding: 0; color: var(--fg); }
  .round svg { width: 28px; height: 28px; }
  .round:disabled { opacity: 0.4; cursor: default; }
  .fab {
    position: fixed; z-index: 21; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(100px + env(safe-area-inset-bottom, 0px));
    display: inline-flex; align-items: center; gap: 10px; padding: 16px 24px; border: 0; border-radius: 99px;
    background: var(--mint); color: var(--mint-ink); font-weight: 800; font-size: 18px;
    box-shadow: 0 10px 30px rgba(82, 214, 163, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    transition: transform 0.12s;
  }
  .fab:active { transform: scale(0.96); }
  .fab svg { width: 22px; height: 22px; stroke-width: 2.6; }

  /* ---------- Game ---------- */
  .gtop { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 10px; padding-block: 0 8px; }
  .icon-btn { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; padding: 0; }
  .icon-btn svg { width: 22px; height: 22px; }
  .gtitle { display: grid; gap: 3px; min-width: 0; line-height: 1; }
  .gtitle b { color: var(--cyan); font-size: 25px; font-weight: 800; letter-spacing: -0.01em; }
  .tile { min-width: 64px; height: 50px; padding: 0 12px; border-radius: 18px; display: grid; place-content: center; text-align: center; line-height: 1.05; }
  .tile span { font-size: 10px; letter-spacing: 0.1em; font-weight: 700; color: var(--cyan); }
  .tile b { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .gsub { padding: 0 4px 14px; color: var(--dim); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }

  .board { position: relative; width: 100%; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .slot, .card { position: absolute; left: 0; top: 0; width: var(--cw); height: var(--ch); border-radius: calc(var(--cw) * 0.12); }
  .slot {
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4);
    display: grid; place-items: center;
    font-size: calc(var(--cw) * 0.5); color: rgba(255, 255, 255, 0.2);
  }
  .slot[data-stock] { cursor: pointer; color: rgba(255, 255, 255, 0.45); }
  .slot[data-stock].dead { cursor: default; opacity: 0.4; }

  /* glass cards: tinted gradient body, rim light, specular sheen */
  .card {
    background: linear-gradient(155deg, rgba(255, 255, 255, 0.98), rgba(233, 243, 247, 0.96) 50%, rgba(207, 225, 233, 0.95));
    color: var(--ink);
    border: 1px solid rgba(255, 255, 255, 0.75);
    box-shadow: inset 0 1px 0 #fff, inset 0 -10px 14px rgba(110, 170, 190, 0.2), 0 3px 8px rgba(0, 0, 0, 0.4);
    transition: transform 0.2s cubic-bezier(0.2, 0.7, 0.2, 1);
    touch-action: none; cursor: pointer;
  }
  .card.red { color: var(--rose); background: linear-gradient(155deg, rgba(255, 255, 255, 0.98), rgba(252, 238, 240, 0.96) 50%, rgba(243, 214, 220, 0.95)); box-shadow: inset 0 1px 0 #fff, inset 0 -10px 14px rgba(220, 120, 140, 0.18), 0 3px 8px rgba(0, 0, 0, 0.4); }
  .card::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(118deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0) 40%);
  }
  .card.flat { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5); }
  .card.dragging { transition: none; will-change: transform; box-shadow: inset 0 1px 0 #fff, 0 16px 28px rgba(0, 0, 0, 0.55); }
  .face { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; }
  .corner {
    position: absolute; left: 8%; top: 3%;
    display: flex; align-items: baseline; gap: 0.05em;
    font-weight: 800; font-size: calc(var(--cw) * 0.36); line-height: 1.15; letter-spacing: -0.03em;
  }
  .corner i { font-style: normal; font-size: 0.84em; letter-spacing: 0; }
  .pip { position: absolute; right: 9%; bottom: 5%; font-size: calc(var(--cw) * 0.56); line-height: 1; }
  .card.down {
    background-color: #15404c;
    background-image:
      repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.13) 0 1px, transparent 1px 7px),
      repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.13) 0 1px, transparent 1px 7px),
      linear-gradient(150deg, rgba(112, 232, 200, 0.7), rgba(36, 110, 130, 0.85) 48%, rgba(30, 40, 100, 0.95));
    border-color: rgba(255, 255, 255, 0.5);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), inset 0 -8px 12px rgba(0, 0, 0, 0.25), 0 3px 8px rgba(0, 0, 0, 0.4);
  }
  .card.down.flat { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4); }
  .card.down .face { display: none; }
  .card.down::before { background: linear-gradient(118deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 45%); }
  .card.down::after { content: ""; position: absolute; inset: 9%; border: 1px solid rgba(255, 255, 255, 0.5); border-radius: calc(var(--cw) * 0.07); }
  .hint { outline: 3px solid var(--mint); outline-offset: 1px; animation: pulse 0.55s ease-in-out 3; }
  @keyframes pulse { 50% { outline-color: rgba(82, 214, 163, 0.2); } }
  .nope { animation: nope 0.3s linear; }
  @keyframes nope { 20% { translate: -4px 0; } 45% { translate: 4px 0; } 70% { translate: -3px 0; } }

  #toast {
    position: fixed; left: 50%; bottom: calc(112px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 8px); z-index: 40; opacity: 0; pointer-events: none;
    padding: 10px 18px; border-radius: 99px; font-size: 14px; font-weight: 600; max-width: calc(100vw - 32px); text-align: center;
    transition: opacity 0.2s, transform 0.2s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  #overlay {
    position: fixed; inset: 0; z-index: 60; display: grid; place-items: center;
    padding: 20px max(16px, env(safe-area-inset-left, 0px));
    background: rgba(4, 8, 11, 0.62);
  }
  #overlay[data-pos="end"] { align-items: end; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  .panel { width: min(380px, 100%); border-radius: 30px; padding: 24px 22px 20px; display: grid; gap: 14px; background-color: rgba(18, 25, 32, 0.78); }
  .eyebrow { margin: 0; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mint); font-weight: 800; }
  .panel h2 { margin: 0; color: var(--cyan); font-size: 36px; line-height: 1.05; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; }
  .panel p { margin: 0; color: var(--dim); }
  .panel dl { margin: 0; border-top: 1px solid var(--line); }
  .panel dl div { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
  .panel dt { color: var(--dim); }
  .panel dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
  .panel .row { display: grid; gap: 8px; }
  .panel ul { margin: 0; padding-left: 18px; color: var(--dim); display: grid; gap: 4px; }
  .btn { padding: 13px 16px; border-radius: 99px; font-weight: 700; font-size: 15px; text-align: center; background: rgba(255, 255, 255, 0.09); border: 1px solid rgba(255, 255, 255, 0.2); transition: transform 0.12s; }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--mint); color: var(--mint-ink); border-color: var(--mint); }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.2); border-top-color: var(--mint); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .wait { text-align: left; justify-items: start; display: grid; gap: 12px; }

  @media (prefers-reduced-motion: reduce) {
    .card, #toast, .row-card, .btn, .dk, .fab { transition: none; }
    .hint, .nope, .spinner, .bg::before { animation: none; }
  }

  /* ---------- v5: game tiles, card states ---------- */
  .games { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .gtile {
    position: relative; aspect-ratio: 1 / 1; min-width: 0; display: grid; align-content: space-between; justify-items: start; text-align: left;
    padding: 16px 16px 14px; border-radius: 28px; border: 1px solid var(--line);
    background: linear-gradient(160deg, color-mix(in srgb, var(--c) 24%, rgba(22, 29, 37, 0.92)), rgba(22, 29, 37, 0.92) 62%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 8px 20px rgba(0, 0, 0, 0.32);
    transition: transform 0.12s, border-color 0.15s;
  }
  .gtile:active { transform: scale(0.97); }
  .gtile:hover { border-color: color-mix(in srgb, var(--c) 55%, transparent); }

<script>
function solverFactory() {
  function red(c) { var s = c >> 4; return s === 1 || s === 2; }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function deal() {
    var d = [], s, r, c, k;
    for (s = 0; s < 4; s++) for (r = 1; r <= 13; r++) d.push(s * 16 + r);
    shuffle(d);
    var tab = [], ups = [];
    for (c = 0; c < 7; c++) { tab.push([]); ups.push(1); }
    for (c = 0; c < 7; c++) for (k = 0; k <= c; k++) tab[c].push(d.pop());
    return { tab: tab, ups: ups, stock: d, waste: [], found: [0, 0, 0, 0], pass: 1 };
  }
  function canTab(c, pile) {
    if (!pile.length) return (c & 15) === 13;
    var t = pile[pile.length - 1];
    return red(t) !== red(c) && (t & 15) === (c & 15) + 1;
  }
  function canF(c, s) { return s.found[c >> 4] === (c & 15) - 1; }
  function won(s) { return s.found[0] + s.found[1] + s.found[2] + s.found[3] === 52; }

  function gen(s, passes) {
    var out = [], w = s.waste.length ? s.waste[s.waste.length - 1] : -1, p, q, i, emptyDone;
    if (w >= 0) {
      if (canF(w, s)) out.push({ k: 'wf', pr: 100, r: w & 15 });
      emptyDone = false;
      for (q = 0; q < 7; q++) {
        if (!s.tab[q].length) { if (emptyDone) continue; emptyDone = true; }
        if (canTab(w, s.tab[q])) out.push({ k: 'wt', q: q, pr: s.tab[q].length ? 60 : 55 });
      }
    }
    for (p = 0; p < 7; p++) {
      var pile = s.tab[p], n = pile.length;
      if (!n) continue;
      var first = n - s.ups[p];
      if (canF(pile[n - 1], s)) out.push({ k: 'tf', p: p, pr: first > 0 && first === n - 1 ? 95 : 90, r: pile[n - 1] & 15 });
      for (i = first; i < n; i++) {
        var card = pile[i], below = i > 0 ? pile[i - 1] : -1;
        var reveals = (i === first && i > 0);
        if (!(i === first || (below >= 0 && canF(below, s)))) continue;
        emptyDone = false;
        for (q = 0; q < 7; q++) {
          if (q === p) continue;
          if (!s.tab[q].length) {
            if (i === 0) continue;
            if (emptyDone) continue;
            emptyDone = true;
          }
          if (!canTab(card, s.tab[q])) continue;
          out.push({ k: 'tt', p: p, i: i, q: q, pr: reveals ? 75 : (i === 0 ? 45 : 50) });
        }
      }
    }
    if (s.stock.length || (s.waste.length && s.pass < passes)) out.push({ k: 'd', pr: 10 });
    out.sort(function (a, b) { return b.pr - a.pr; });
    return out;
  }
  function reveal(n, p) { if (n.ups[p] === 0 && n.tab[p].length > 0) n.ups[p] = 1; }
  function apply(s, m, draw) {
    var n = { tab: s.tab.slice(), ups: s.ups.slice(), stock: s.stock, waste: s.waste, found: s.found.slice(), pass: s.pass };
    var c, pile, moved;
    if (m.k === 'wf') {
      c = s.waste[s.waste.length - 1]; n.waste = s.waste.slice(0, -1); n.found[c >> 4]++;
    } else if (m.k === 'wt') {
      c = s.waste[s.waste.length - 1]; n.waste = s.waste.slice(0, -1);
      n.tab[m.q] = s.tab[m.q].concat([c]); n.ups[m.q] = s.ups[m.q] + 1;
    } else if (m.k === 'tf') {
      pile = s.tab[m.p]; c = pile[pile.length - 1];
      n.tab[m.p] = pile.slice(0, -1); n.ups[m.p] = s.ups[m.p] - 1; reveal(n, m.p); n.found[c >> 4]++;
    } else if (m.k === 'tt') {
      pile = s.tab[m.p]; moved = pile.slice(m.i);
      n.tab[m.p] = pile.slice(0, m.i); n.ups[m.p] = s.ups[m.p] - moved.length; reveal(n, m.p);
      n.tab[m.q] = s.tab[m.q].concat(moved); n.ups[m.q] = s.ups[m.q] + moved.length;
    } else {
      if (s.stock.length) {
        var k = Math.min(draw, s.stock.length);
        n.stock = s.stock.slice(0, s.stock.length - k);
        n.waste = s.waste.concat(s.stock.slice(s.stock.length - k).reverse());
      } else {
        n.stock = s.waste.slice().reverse(); n.waste = []; n.pass = s.pass + 1;
      }
    }
    return n;
  }
  function key(s) {
    return s.tab.map(function (p) { return p.join(','); }).join('|') + '#' + s.ups.join('') + '#' +
      s.stock.join(',') + '#' + s.waste.join(',') + '#' + s.found.join(',') + '#' + s.pass;
  }
  function autoWin(s) {
    if (s.stock.length || s.waste.length) return false;
    for (var p = 0; p < 7; p++) if (s.ups[p] !== s.tab[p].length) return false;
    var f = s.found.slice(), tabs = s.tab.map(function (x) { return x.length; }), moved = true;
    while (moved) {
      moved = false;
      for (p = 0; p < 7; p++) {
        if (tabs[p] > 0) {
          var c = s.tab[p][tabs[p] - 1];
          if (f[c >> 4] === (c & 15) - 1) { f[c >> 4]++; tabs[p]--; moved = true; }
        }
      }
    }
    return f[0] + f[1] + f[2] + f[3] === 52;
  }

  function solve(s0, cfg) {
    var seen = {}, nodes = 0, limit = cfg.nodes, passes = Math.min(cfg.passes, 6), aborted = false;
    function dfs(s) {
      if (won(s) || autoWin(s)) return true;
      if (++nodes > limit) { aborted = true; return false; }
      var ms = gen(s, passes);
      if (ms.length && (ms[0].k === 'wf' || ms[0].k === 'tf') && ms[0].r <= 2) ms = [ms[0]];
      for (var i = 0; i < ms.length; i++) {
        var ns = apply(s, ms[i], cfg.draw), k = key(ns);
        if (seen[k]) continue;
        seen[k] = 1;
        if (dfs(ns)) return true;
        if (aborted) return false;
      }
      return false;
    }
    seen[key(s0)] = 1;
    return dfs(s0);
  }

  function greedy(s, cfg) {
    var idle = 0, limitIdle = Math.ceil(52 / cfg.draw) * 2 + 4, steps = 0;
    while (steps++ < 4000) {
      if (won(s) || autoWin(s)) return true;
      var ms = gen(s, cfg.passes), m = null, i;
      for (i = 0; i < ms.length; i++) { if (ms[i].k !== 'd' && ms[i].pr >= 55) { m = ms[i]; break; } }
      if (m) idle = 0;
      else {
        for (i = 0; i < ms.length; i++) if (ms[i].k === 'd') { m = ms[i]; break; }
        if (!m) return false;
        if (++idle > limitIdle) return false;
      }
      s = apply(s, m, cfg.draw);
    }
    return false;
  }


  var KCFG = { draw: 1, passes: 1e9, nodes: 30000, minMoves: 2 };
  function genKlondike() {
    for (;;) {
      var s = deal();
      var g = gen(s, KCFG.passes), cnt = 0, i;
      for (i = 0; i < g.length; i++) if (g[i].k !== 'd') cnt++;
      if (cnt < KCFG.minMoves) continue;
      var ok = false;
      try { ok = solve(s, KCFG); } catch (err) { ok = false; }
      if (ok) return { tab: s.tab, stock: s.stock };
    }
  }

  // ===== shared helpers for Pyramid and TriPeaks =====
  function deck52() {
    var d = [], s, r;
    for (s = 0; s < 4; s++) for (r = 1; r <= 13; r++) d.push(s * 16 + r);
    return shuffle(d);
  }
  var FULL = 268435455;

  // ===== Pyramid =====
  var PL = [], PR = [];
  (function () {
    var r, k, i = 0;
    for (r = 0; r < 7; r++) for (k = 0; k <= r; k++) {
      if (r < 6) { PL[i] = (r + 1) * (r + 2) / 2 + k; PR[i] = PL[i] + 1; } else { PL[i] = -1; PR[i] = -1; }
      i++;
    }
  })();
  function pyramidSolve(pyr, stock0, passesMax, limit) {
    var nodes = 0, aborted = false, seen = {};
    function freeList(mask) {
      var out = [], i;
      for (i = 0; i < 28; i++) {
        if ((mask >> i) & 1) continue;
        if (PL[i] < 0 || (((mask >> PL[i]) & 1) && ((mask >> PR[i]) & 1))) out.push(i);
      }
      return out;
    }
    function dfs(mask, stock, waste, pass) {
      if (mask === FULL) return true;
      if (++nodes > limit) { aborted = true; return false; }
      var free = freeList(mask), i, j, tries = [];
      for (i = 0; i < free.length; i++) {
        if ((pyr[free[i]] & 15) === 13) { tries = [[mask | (1 << free[i]), stock, waste, pass]]; break; }
      }
      if (!tries.length) {
        for (i = 0; i < free.length; i++) for (j = i + 1; j < free.length; j++) {
          if ((pyr[free[i]] & 15) + (pyr[free[j]] & 15) === 13) tries.push([mask | (1 << free[i]) | (1 << free[j]), stock, waste, pass]);
        }
        if (waste.length) {
          var w = waste[waste.length - 1], wr = w & 15;
          if (wr === 13) tries.push([mask, stock, waste.slice(0, -1), pass]);
          for (i = 0; i < free.length; i++) {
            if ((pyr[free[i]] & 15) + wr === 13) tries.push([mask | (1 << free[i]), stock, waste.slice(0, -1), pass]);
          }
        }
        if (stock.length) tries.push([mask, stock.slice(0, -1), waste.concat([stock[stock.length - 1]]), pass]);
        else if (waste.length && pass < passesMax) tries.push([mask, waste.slice().reverse(), [], pass + 1]);
      }
      for (i = 0; i < tries.length; i++) {
        var t = tries[i], k = t[0] + '|' + t[1].join(',') + '|' + t[2].join(',') + '|' + t[3];
        if (seen[k]) continue;
        seen[k] = 1;
        if (dfs(t[0], t[1], t[2], t[3])) return true;
        if (aborted) return false;
      }
      return false;
    }
    return dfs(0, stock0.slice(), [], 1);
  }
  function genPyramid() {
    for (;;) {
      var d = deck52(), pyr = d.slice(0, 28), stock = d.slice(28);
      var ok = false;
      try { ok = pyramidSolve(pyr, stock, 3, 60000); } catch (err) { ok = false; }
      if (ok) return { pyr: pyr, stock: stock };
    }
  }

  // ===== TriPeaks =====
  var TL = [], TR = [];
  (function () {
    var i;
    for (i = 0; i < 28; i++) { TL[i] = -1; TR[i] = -1; }
    for (i = 0; i < 3; i++) { TL[i] = 3 + 2 * i; TR[i] = 3 + 2 * i + 1; }
    for (i = 0; i < 6; i++) { TL[3 + i] = 9 + (i >> 1) * 3 + (i & 1); TR[3 + i] = TL[3 + i] + 1; }
    for (i = 0; i < 9; i++) { TL[9 + i] = 18 + i; TR[9 + i] = 18 + i + 1; }
  })();
  function adj(a, b) { var d = Math.abs((a & 15) - (b & 15)); return d === 1 || d === 12; }
  function tripeaksSolve(pk, stock0, first, limit) {
    var nodes = 0, aborted = false, seen = {};
    function dfs(mask, stock, curc) {
      if (mask === FULL) return true;
      if (++nodes > limit) { aborted = true; return false; }
      var i, tries = [];
      for (i = 0; i < 28; i++) {
        if ((mask >> i) & 1) continue;
        if (TL[i] >= 0 && !(((mask >> TL[i]) & 1) && ((mask >> TR[i]) & 1))) continue;
        if (adj(pk[i], curc)) tries.push([mask | (1 << i), stock, pk[i]]);
      }
      if (stock.length) tries.push([mask, stock.slice(0, -1), stock[stock.length - 1]]);
      for (i = 0; i < tries.length; i++) {
        var t = tries[i], k = t[0] + '|' + t[1].length + '|' + t[2];
        if (seen[k]) continue;
        seen[k] = 1;
        if (dfs(t[0], t[1], t[2])) return true;
        if (aborted) return false;
      }
      return false;
    }
    return dfs(0, stock0.slice(), first);
  }
  function genTripeaks() {
    for (;;) {
      var d = deck52(), pk = d.slice(0, 28), first = d[28], stock = d.slice(29);
      var ok = false;
      try { ok = tripeaksSolve(pk, stock, first, 120000); } catch (err) { ok = false; }
      if (ok) return { pk: pk, stock: stock, first: first };
    }
  }

  function generate(game) {
    if (game === 'pyramid') return genPyramid();
    if (game === 'tripeaks') return genTripeaks();
    return genKlondike();
  }

  if (typeof self !== 'undefined' && typeof document === 'undefined') {
    self.onmessage = function (e) {
      var game = e.data.game;
      self.postMessage({ game: game, deal: generate(game) });
    };
  }
  return { generate: generate };
}

  function fmt(sec) { var m = Math.floor(sec / 60), s = sec % 60; return m + ':' + (s < 10 ? '0' : '') + s; }

  function shuffle(a) {

    piles.forEach(function (pile, p) {

    pump();
  }
  function initWorker() {
    try {
      var src = '(' + solverFactory.toString() + ')()';
      var url = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));
      worker = new Worker(url);
      worker.onmessage = function (e) {
        var d = e.data;
        wBusy = false; curJob = null;
        ready[d.game].push(d.deal);
        var cb = waiters[d.game];
        if (cb) { waiters[d.game] = null; cb(ready[d.game].shift()); enqueue(d.game); }
        pump();
      };
      worker.onerror = function () {
        worker = null; wBusy = false;
        Object.keys(waiters).forEach(function (g) { var cb = waiters[g]; waiters[g] = null; if (cb) cb(null); });
      };
      if (ready[lastGame]) enqueue(lastGame);
      ['klondike', 'pyramid', 'tripeaks'].forEach(function (g) { enqueue(g); });
    } catch (e) { worker = null; }
  }
  function getDeal(g, cb) {
    if (!ready[g]) { cb(null); return; }
    if (ready[g].length) { cb(ready[g].shift()); enqueue(g); return; }
    if (!worker) { cb(null); return; }
    waiters[g] = cb;
    enqueue(g, true);
  }

  /* =====================================================================
     ENGINE
     ===================================================================== */
  function makeCard(c) {
    var el = document.createElement('div');
    el.className = 'card gone' + (isRed(c.s) ? ' red' : '');
    el.dataset.id = c.id;
    el.innerHTML = '<div class="face"><div class="corner"><b>' + RANKS[c.r] + '</b><i>' + SUITS[c.s] +
      '</i></div><div class="pip">' + SUITS[c.s] + '</div></div>';
    return el;
  }
  function buildBoard() {
    board.innerHTML = '';
    els.clear(); pos.clear(); st.clear(); slotEls = {}; slotSt = {};
    cur.cards(S).forEach(function (c) {
      var el = makeCard(c);
      els.set(c.id, el);
      board.appendChild(el);
      st.set(c.id, { x: NaN, y: NaN, z: -1, down: null, flat: null, dim: null, sel: null, gone: true });
    });
  }
  function layout() {
    cur.layout(board.clientWidth);
    board.style.setProperty('--cw', cw + 'px');
    board.style.setProperty('--ch', ch + 'px');
    st.forEach(function (v) { v.x = NaN; });
    Object.keys(slotSt).forEach(function (k) { slotSt[k].x = NaN; });
  }
  function render() {
    var v = cur.view(S), seen = new Set();
    v.slots.forEach(function (sl) {
      var el = slotEls[sl.k], s = slotSt[sl.k];
      if (!el) {
        el = document.createElement('div');
        el.className = 'slot' + (sl.click ? ' click' : '');
        el.dataset.k = sl.k;
        board.appendChild(el);
        slotEls[sl.k] = el;
        s = slotSt[sl.k] = { x: NaN, y: NaN, t: null, cls: '' };
      }
      if (s.x !== sl.x || s.y !== sl.y) { setPos(el, sl.x, sl.y); s.x = sl.x; s.y = sl.y; }
      var t = sl.t || '';
      if (s.t !== t) { el.textContent = t; s.t = t; }
      var cls = sl.cls || '';
      if (s.cls !== cls) { el.classList.toggle('dead', cls === 'dead'); s.cls = cls; }
    });
    v.items.forEach(function (it) {
      var c = it.c, el = els.get(c.id);
      if (!el) return;
      seen.add(c.id);
      pos.set(c.id, { x: it.x, y: it.y });
      var s = st.get(c.id);
      if (s.gone) { el.classList.remove('gone'); s.gone = false; }
      if (s.x !== it.x || s.y !== it.y) { setPos(el, it.x, it.y); s.x = it.x; s.y = it.y; }
      if (s.z !== it.z) { el.style.zIndex = it.z; s.z = it.z; }
      var dn = !c.up;
      if (s.down !== dn) {
        el.classList.toggle('down', dn);
        el.setAttribute('aria-label', dn ? 'Carta virada' : RANK_NAMES[c.r] + ' de ' + SUIT_NAMES[c.s]);
        s.down = dn;
      }
      var fl = !!it.flat; if (s.flat !== fl) { el.classList.toggle('flat', fl); s.flat = fl; }
      var dm = !!it.dim; if (s.dim !== dm) { el.classList.toggle('dim', dm); s.dim = dm; }
      var sl = !!it.sel; if (s.sel !== sl) { el.classList.toggle('sel', sl); s.sel = sl; }
      if (el.classList.contains('dragging')) el.classList.remove('dragging');
    });
    st.forEach(function (s, id) {
      if (!seen.has(id) && !s.gone) { els.get(id).classList.add('gone'); s.gone = true; }
    });
    board.style.height = Math.ceil(v.h) + 'px';
  }
  function hud() {
    $('hScore').textContent = S.score;
    $('hTime').textContent = fmt(elapsed);
    $('lvName').textContent = cur.name;
    $('lvRules').textContent = cur.info(S);
    var can = history.length > 0 && !busy && !ended;
    $('btnUndo').disabled = !can;
    $('btnUndoAll').disabled = !can;
    $('btnHint').disabled = busy || ended;
  }

  // ---------- timer ----------
  function startTimer() {
    if (ended) return;
    started = true;
    if (timerId) return;
    startTime = Date.now() - elapsed * 1000;
    timerId = setInterval(function () {
      elapsed = Math.floor((Date.now() - startTime) / 1000);
      $('hTime').textContent = fmt(elapsed);
    }, 500);
  }
  function stopTimer() { clearInterval(timerId); timerId = null; }

  // ---------- actions ----------
  function snapshot() {
    history.push(JSON.stringify(S));
    if (history.length > 300) history.shift();
  }
  function shake(uid) {
    var el = els.get(uid);
    if (!el) return;
    el.classList.remove('nope');
    void el.offsetWidth;
    el.classList.add('nope');
    setTimeout(function () { el.classList.remove('nope'); }, 320);
  }
  function act(fn, shakeUid) {
    if (busy || ended) return;
    snapshot();
    var r = fn();
    if (r === true) { startTimer(); S.moves++; stuckShown = false; after(); }
    else {
      history.pop();
      if (r === 'soft') render();
      else if (shakeUid != null) shake(shakeUid);
    }
  }
  function undo() {
    if (busy || ended || !history.length) return;
    S = JSON.parse(history.pop());
    stuckShown = false;
    hideOverlay();
    render(); hud();
  }
  function undoAll() {
    if (busy || ended || !history.length) return;
    S = JSON.parse(initialJSON);
    history = [];
    stuckShown = false;
    hideOverlay();
    render(); hud();
    toast('Mesa reiniciada.');
  }
  function after() {
    render(); hud();
    if (cur.won(S)) { win(); return; }
    if (cur.autoReady(S)) { autoFinish(); return; }
    if (!ended && cur.stuck(S)) setTimeout(function () { if (!ended && !stuckShown && cur.stuck(S)) showStuck(); }, 450);
  }
  function autoFinish() {
    busy = true;
    hud();
    var iv = setInterval(function () {
      var moved = cur.autoStep(S);
      if (moved) S.moves++;
      render(); hud();
      if (cur.won(S) || !moved) {
        clearInterval(iv);
        busy = false;
        if (cur.won(S)) win(); else hud();
      }
    }, 110);
  }

  // ---------- hint ----------
  function flash(el) {
    if (!el) return;
    el.classList.remove('hint');
    void el.offsetWidth;
    el.classList.add('hint');
    setTimeout(function () { el.classList.remove('hint'); }, 1800);
  }
  function hint() {
    if (busy || ended) return;
    var h = cur.hint(S);
    if (!h) { toast('Nenhuma jogada disponível.'); return; }
    (h.from || []).forEach(function (c) { flash(els.get(c.id)); });
    if (h.to) {
      if (h.to.card) flash(els.get(h.to.card.id));
      else if (h.to.slot) flash(slotEls[h.to.slot]);
    }
    if (h.msg) toast(h.msg);
  }

  // ---------- drag and tap ----------
  function findDrop(grp, x, y) {
    var best = null, bestA = 0;
    cur.targets(S, grp).forEach(function (t) {
      var ox = Math.max(0, Math.min(x + cw, t.x + t.w) - Math.max(x, t.x));
      var oy = Math.max(0, Math.min(y + ch, t.y + t.h) - Math.max(y, t.y));
      var a = ox * oy;
      if (a > bestA) { bestA = a; best = t.dst; }
    });
    return bestA >= cw * ch * 0.15 ? best : null;
  }
  board.addEventListener('pointerdown', function (e) {
    if (busy || ended || e.button > 0 || down) return;
    var el = e.target.closest('.card');
    if (!el) return;
    var id = +el.dataset.id;
    down = { id: id, x: e.clientX, y: e.clientY, drag: false, grp: cur.grab(S, id) };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
  });
  function startDrag() {
    down.drag = true;
    down.grp.cards.forEach(function (c, k) {
      var el = els.get(c.id);
      el.classList.add('dragging');
      el.style.zIndex = 1000 + k;
      var s = st.get(c.id); if (s) { s.x = NaN; s.z = -1; }
    });
  }
  function frame() {
    raf = 0;
    if (!down || !lastE) return;
    var dx = lastE.clientX - down.x, dy = lastE.clientY - down.y;
    if (!down.drag && down.grp && Math.hypot(dx, dy) > 7) startDrag();
    if (down.drag) {
      down.grp.cards.forEach(function (c) {
        var p = pos.get(c.id);
        setPos(els.get(c.id), p.x + dx, p.y + dy);
      });
    }
  }
  function onMove(e) {
    if (!down) return;
    lastE = e;
    if (!raf) raf = requestAnimationFrame(frame);
  }
  function cleanup() {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onCancel);
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  }
  function onCancel() {
    cleanup();
    down = null;
    if (S) render();
  }
  function onUp(e) {
    cleanup();
    var d = down;
    down = null;
    if (!d) return;
    var dx = e.clientX - d.x, dy = e.clientY - d.y;
    if (!d.drag && d.grp && Math.hypot(dx, dy) > 7) { down = d; startDrag(); d = down; down = null; }
    if (d.drag) {
      var p0 = pos.get(d.grp.cards[0].id);
      var dst = findDrop(d.grp, p0.x + dx, p0.y + dy);
      if (dst) act(function () { cur.move(S, d.grp.from, dst); return true; });
      else render();
    } else if (Math.hypot(dx, dy) < 14) {
      act(function () { return cur.tap(S, d.id); }, d.id);
    }
  }
  board.addEventListener('click', function (e) {
    if (e.target.closest('.card')) return;
    var sl = e.target.closest('.slot');
    if (sl) act(function () { return cur.slotTap(S, sl.dataset.k); });
  });

  // ---------- panels ----------
  function showPanel(html) {
    overlay.innerHTML = '<div class="panel glass">' + html + '</div>';
    overlay.removeAttribute('data-pos');
    overlay.hidden = false;
  }
  function hideOverlay() { overlay.hidden = true; overlay.innerHTML = ''; overlay.removeAttribute('data-pos'); }
  function win() {
    ended = true;
    stopTimer();
    var bonus = Math.max(0, 900 - elapsed);
    var total = S.score + bonus;
    var r = rec[cur.id] || { wins: 0, best: 0, bestTime: 0 };
    var isBest = total > r.best;
    r.wins++;
    if (isBest) r.best = total;
    if (!r.bestTime || elapsed < r.bestTime) r.bestTime = elapsed;
    rec[cur.id] = r;
    saveRec();
    showPanel(
      '<p class="eyebrow">' + cur.name + ' · concluído</p><h2>Mesa limpa</h2>' +
      (isBest && r.wins > 1 ? '<p>Novo recorde neste jogo.</p>' : '') +
      '<dl><div><dt>Pontos</dt><dd>' + S.score + '</dd></div>' +
      '<div><dt>Bônus de tempo</dt><dd>' + bonus + '</dd></div>' +
      '<div><dt>Total</dt><dd>' + total + '</dd></div>' +
      '<div><dt>Tempo</dt><dd>' + fmt(elapsed) + '</dd></div>' +
      '<div><dt>Jogadas</dt><dd>' + S.moves + '</dd></div></dl>' +
      '<div class="row"><button class="btn primary" data-act="again" type="button">Jogar de novo</button>' +
      '<button class="btn" data-act="menu" type="button">Voltar ao menu</button></div>');
    hud();
  }
  function showStuck() {
    stuckShown = true;
    var canU = history.length > 0;
    showPanel(
      '<p class="eyebrow">' + cur.name + '</p><h2>Sem jogadas</h2>' +
      '<p>' + (cur.solver ? 'Esta mesa tinha solução. Volte algumas jogadas e tente outro caminho.' : 'Não há mais movimentos possíveis. Volte algumas jogadas ou comece outra mesa.') + '</p>' +
      '<div class="row">' +
      (canU ? '<button class="btn primary" data-act="undo" type="button">Desfazer jogada</button>' : '') +
      '<button class="btn' + (canU ? '' : ' primary') + '" data-act="again" type="button">Novo jogo</button>' +
      '<button class="btn" data-act="peek" type="button">Ver a mesa</button></div>');
  }
  overlay.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) { if (e.target === overlay && !overlay.querySelector('.wait')) hideOverlay(); return; }
    var a = b.dataset.act;
    if (a === 'again') startGame(cur.id);
    else if (a === 'menu') showMenu();
    else if (a === 'undo') undo();
    else if (a === 'peek') hideOverlay();
  });

  // ---------- flow ----------
  function begin(g, state) {
    stopTimer();
    cur = g; S = state;
    initialJSON = JSON.stringify(S);
    history = [];
    elapsed = 0; started = false; ended = false; busy = false; stuckShown = false; down = null;
    hideOverlay();
    menu.hidden = true; mdock.hidden = true;
    game.hidden = false; dock.hidden = false;
    window.scrollTo(0, 0);
    buildBoard();
    layout();
    render();
    hud();
  }
  function startGame(id) {
    var g = GAMES[id];
    lastGame = id;
    try { localStorage.setItem(KEY2, id); } catch (e) {}
    var token = ++startToken, done = false;
    getDeal(id, function (d) {
      if (token !== startToken) return;
      done = true;
      begin(g, g.init(d));
    });
    if (!done) {
      showPanel('<div class="wait"><div class="spinner" aria-hidden="true"></div><h2>Embaralhando</h2>' +
        '<p>Procurando uma mesa de ' + g.name + ' que tenha solução.</p></div>');
    }
  }
  function inProgress() { return !!(S && cur && !ended && started); }
  function showMenu() {
    startToken++;
    stopTimer();
    hideOverlay();
    paintMenu();
    game.hidden = true; dock.hidden = true;
    menu.hidden = false; mdock.hidden = false;
    window.scrollTo(0, 0);
  }
  function resumeGame() {
    if (!inProgress()) return;
    menu.hidden = true; mdock.hidden = true;
    game.hidden = false; dock.hidden = false;
    layout(); render(); hud();
    startTimer();
  }

  // ---------- menu ----------
  var CHECK = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var GO = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="fill: currentColor; stroke: none"><path d="M8 5.5v13l11-6.5z"/></svg>';
  function paintMenu() {
    var cleared = ORDER.filter(function (k) { return rec[k] && rec[k].wins; }).length;
    $('secCount').textContent = cleared + '/5 vencidos';
    var rb = $('resumeBox'), prog = inProgress();
    rb.hidden = !prog;
    if (prog) {
      rb.innerHTML = '<button class="row-card resume" type="button" data-resume="1"><span class="chk on">' + GO + '</span>' +
        '<span class="rc-main"><span class="rc-title"><b>Continuar partida</b></span>' +
        '<span class="rc-rec">' + cur.name + ' · ' + fmt(elapsed) + ' · ' + S.score + ' pts · ' + S.moves + ' jogadas</span></span>' +
        '<span class="go">' + GO + '</span></button>';
    }
    $('games').innerHTML = ORDER.map(function (k) {
      var m = META[k], won = rec[k] && rec[k].wins;
      return '<button class="gtile" type="button" data-game="' + k + '" style="--c: ' + m.color + '">' +
        '<span class="gt-art" aria-hidden="true">' + ART[k] + '</span>' +
        '<span><span class="gt-name">' + GAMES[k].name + '</span><span class="gt-sub">' + m.sub + '</span></span>' +
        (won ? '<span class="gt-badge" aria-label="Já venceu">' + CHECK + '</span>' : '') + '</button>';
    }).join('');
    $('recList').innerHTML = ORDER.map(function (k) {
      var m = META[k], r = rec[k] || { wins: 0, best: 0, bestTime: 0 };
      return '<div class="row-card" style="--c: ' + m.color + '"><span></span><span class="rc-main">' +
        '<span class="rc-title"><b>' + GAMES[k].name + '</b></span>' +
        '<dl class="stats"><div><dt>Vitórias</dt><dd>' + r.wins + '</dd></div>' +
        '<div><dt>Melhor pontuação</dt><dd>' + (r.wins ? r.best : '–') + '</dd></div>' +
        '<div><dt>Melhor tempo</dt><dd>' + (r.wins ? fmt(r.bestTime) : '–') + '</dd></div></dl></span><span></span></div>';
    }).join('');
    $('helpList').innerHTML = ORDER.map(function (k) {
      var m = META[k];
      return '<div class="row-card" style="--c: ' + m.color + '"><span></span><span class="help-block"><h3>' + GAMES[k].name + '</h3>' +
        '<ul class="help-list">' + m.help.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul></span><span></span></div>';
    }).join('');
  }
  function setTab(t) {
    tab = t;
    ['Play', 'Rec', 'Help'].forEach(function (n) { $('tab' + n).hidden = (n !== t); });
    Array.prototype.forEach.call(mdock.querySelectorAll('.tab'), function (b) { b.classList.toggle('on', b.dataset.tab === t); });
    window.scrollTo(0, 0);
  }

  mdock.addEventListener('click', function (e) {
    var b = e.target.closest('.tab');
    if (b) setTab(b.dataset.tab);
  });
  menu.addEventListener('click', function (e) {
    if (e.target.closest('[data-resume]')) { resumeGame(); return; }
    var b = e.target.closest('[data-game]');
    if (b) startGame(b.dataset.game);
  });
  $('btnBack').addEventListener('click', showMenu);
  $('btnUndo').addEventListener('click', undo);
  $('btnUndoAll').addEventListener('click', undoAll);
  $('btnHint').addEventListener('click', hint);
  $('btnNew').addEventListener('click', function () {
    var b = $('btnNew');
    if (!newArmed) {
      newArmed = true;
      $('lNew').textContent = 'Confirmar?';
      b.classList.add('arm');
      clearTimeout(newTimer);
      newTimer = setTimeout(function () { newArmed = false; $('lNew').textContent = 'Novo'; b.classList.remove('arm'); }, 2500);
    } else {
      clearTimeout(newTimer);
      newArmed = false;
      $('lNew').textContent = 'Novo';
      b.classList.remove('arm');
      startGame(cur.id);
    }
  });
  var rz = 0;
  window.addEventListener('resize', function () {
    clearTimeout(rz);
    rz = setTimeout(function () { if (S && cur && !game.hidden) { layout(); render(); } }, 80);
  });

  initWorker();
  paintMenu();
  setTab('Play');
})();
</script>
<script>
(function () {
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  var btn = document.getElementById('btnInstall'), ios = document.getElementById('iosHint'), deferred = null;
  if (!standalone) {
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; btn.hidden = false; });
    if (/iphone|ipad|ipod/i.test(navigator.userAgent)) ios.hidden = false;
  }
  btn.addEventListener('click', function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; btn.hidden = true; });
  });
  window.addEventListener('appinstalled', function () { btn.hidden = true; ios.hidden = true; });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
